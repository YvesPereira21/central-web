<article class="w-full max-w-[600px] mx-auto min-h-[calc(100vh-10rem)] flex flex-col justify-center">
    <section class="rounded-xl bg-[#161B22] p-6 text-white shadow-lg">
        <div class="space-y-6">
            <!-- Form -->
            <form [formGroup]="loginForm" class="space-y-5">
                <!-- Email -->
                <div class="space-y-1.5">
                    <label for="email" class="text-sm font-medium text-gray-300">Email</label>
                    <input id="email" formControlName="email" type="email" placeholder="ex: maicon@email.com" required
                        class="w-full rounded-lg border border-[#30363d] bg-[#0d1117] px-4 py-3 text-white placeholder:text-gray-500 focus:border-emerald-500 focus:outline-none" />
                </div>

                <!-- Password -->
                <div class="space-y-1.5">
                    <label for="password" class="text-sm font-medium text-gray-300">Senha</label>
                    <input id="password" formControlName="password" type="password" placeholder="••••••••" required
                        class="w-full rounded-lg border border-[#30363d] bg-[#0d1117] px-4 py-3 text-white placeholder:text-gray-500 focus:border-emerald-500 focus:outline-none" />
                    <p class="text-xs text-gray-500">Mínimo de 8 caracteres</p>
                </div>

                <!-- Action buttons -->
                <div class="flex flex-wrap items-center justify-end gap-3 pt-4">
                    <button type="submit"
                        class="inline-flex items-center gap-2 rounded-lg bg-emerald-600 px-5 py-2.5 text-sm font-medium text-white shadow-sm transition-all hover:bg-emerald-500 hover:shadow-md"
                        (click)="onSubmit()" [disabled]="isSubmiting || loginForm.invalid">
                        @if (isSubmiting) {
                        Logando
                        } @else{
                        Login
                        }
                    </button>
                </div>
            </form>

            <!-- Divider -->
            <div class="relative flex items-center justify-center my-4">
                <div class="border-t border-[#30363d] w-full"></div>
                <span class="bg-[#161B22] px-3 text-xs text-gray-400 font-medium absolute">ou</span>
            </div>

            <!-- Social Login Button -->
            <div>
                <a href="http://localhost:8080/oauth2/authorization/google"
                    class="w-full flex items-center justify-center gap-3 rounded-lg border border-[#30363d] bg-[#0d1117] px-4 py-2.5 text-sm font-medium text-white hover:bg-[#1f242c] hover:border-gray-500 transition-all duration-200 shadow-sm">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.25 21.3 7.31 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.17 0 9.99 0 12s.46 3.83 1.26 5.42l4.02-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                    <span>Entrar com o Google</span>
                </a>
            </div>

            <!-- Link to create account -->
            <div class="text-center">
                <span class="text-sm text-gray-400">
                    Não possui conta?
                    <a [routerLink]="['/create-profile']" class="text-emerald-400 hover:underline">
                        Crie por aqui
                    </a>
                </span>
            </div>
        </div>
    </section>
</article>
