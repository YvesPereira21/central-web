<header class="bg-[#161b22] border-b border-[#30363d] px-6 py-3.5 flex items-center justify-between shadow-lg">
  <!-- Esquerda: Título do Painel -->
  <div class="flex items-center gap-3">
    <a routerLink="/admin/qualifications" class="flex items-center gap-2 group">
      <span class="text-xl font-black tracking-tight text-white group-hover:text-emerald-400 transition-colors">
        Painel do Administrador
      </span>
    </a>
  </div>

  <!-- Direita: Perfil Admin e Logout -->
  <div class="flex items-center gap-4">
    <div class="flex items-center gap-2.5 bg-[#0d1117] border border-[#30363d] px-3 py-1.5 rounded-lg text-sm text-gray-200">
      <div class="size-6 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/40 flex items-center justify-center font-bold text-xs">
        A
      </div>
      <span class="font-medium text-xs sm:text-sm">Administrador</span>
    </div>

    <button (click)="authService.logout()"
      class="bg-red-500/10 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30 hover:border-transparent px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-4">
        <path fill-rule="evenodd" d="M16.5 2.25a3 3 0 0 1 3 3v13.5a3 3 0 0 1-3 3h-6a3 3 0 0 1-3-3V16.5h1.5v2.25a1.5 1.5 0 0 0 1.5 1.5h6a1.5 1.5 0 0 0 1.5-1.5V5.25a1.5 1.5 0 0 0-1.5-1.5h-6a1.5 1.5 0 0 0-1.5 1.5V7.5H7.5V5.25a3 3 0 0 1 3-3h6Z" clip-rule="evenodd" />
        <path fill-rule="evenodd" d="M3.53 11.47a.75.75 0 0 0 0 1.06l4.5 4.5a.75.75 0 0 0 1.06-1.06l-3.22-3.22H15a.75.75 0 0 0 0-1.5H5.87l3.22-3.22a.75.75 0 0 0-1.06-1.06l-4.5 4.5Z" clip-rule="evenodd" />
      </svg>
      <span>Sair</span>
    </button>
  </div>
</header>
