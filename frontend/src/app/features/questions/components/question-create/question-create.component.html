<section class="w-full max-w-[940px] mx-auto">
    <!-- create question -->
    <div class="rounded-xl bg-[#161B22] p-6 text-white shadow-lg space-y-6">
        <div class="flex items-center justify-between border-b border-[#30363d] pb-4">
            <button type="button" (click)="goBack()" class="inline-flex items-center gap-2 text-sm font-medium text-gray-400 hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                </svg>
                Voltar
            </button>
            <h1 class="text-xl font-semibold text-gray-200">
                {{ isEditMode ? 'Editar Pergunta' : 'Nova Pergunta' }}
            </h1>
        </div>
        <!-- Forms-->
        <form [formGroup]="questionForm" class="space-y-5">
            <!-- Ttle -->
            <div>
                <label for="title" class="text-sm font-medium text-gray-300">Título</label>
                <input id="title" formControlName="title" type="text"
                    placeholder="Ex: Como implementar Refresh Token com Axios e Spring Boot" class="w-full rounded-lg border border-[#30363d] bg-[#0d1117] px-4 py-3 text-white placeholder:text-gray-500 
                    focus:border-emerald-500 focus:outline-none font-inter" />
            </div>

            <!-- Tag Selector Component -->
            <app-tag-selector [technologyNames]="technologyNames"></app-tag-selector>

            <!-- Content -->
            <div>
                <label for="content" class="text-sm font-medium text-gray-300">Conteúdo</label>
                <textarea id="content" formControlName="content" rows="10" placeholder="Escreva seu artigo aqui..."
                    class="w-full rounded-lg border border-[#30363d] bg-[#0d1117] px-4 py-3 text-white placeholder:text-gray-500 focus:border-emerald-500 focus:outline-none font-lora">
                </textarea>
            </div>

            <div class="flex justify-end pt-4">
                <button type="submit"
                    class="inline-flex items-center gap-2 rounded-lg bg-emerald-600 px-5 py-2.5 text-sm font-medium text-white shadow-sm transition-all hover:bg-emerald-500 hover:shadow-md"
                    (click)="onSubmit()" [disabled]="isSubmiting || questionForm.invalid">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-4">
                        <path fill-rule="evenodd"
                            d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z"
                            clip-rule="evenodd" />
                    </svg>
                    @if (isSubmiting) {
                        @if (isEditMode) {
                            Editando...
                        } @else {
                            Criando...
                        }
                    } @else {
                        @if (isEditMode) {
                            Editar
                        } @else {
                            Criar
                        }
                    }
                </button>
            </div>
        </form>
    </div>
</section>
