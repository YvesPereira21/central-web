<section [class]="showPreview() ? 'w-full' : 'w-full max-w-[940px] mx-auto'">
    <!-- Grid que divide a tela ao meio em 2 colunas ocupando todo o espaço -->
    <div [class]="showPreview() ? 'grid grid-cols-1 lg:grid-cols-2 gap-6 items-start w-full' : 'block'">

        <!-- ================= LADO ESQUERDO: O FORMULÁRIO INTEIRO ================= -->
        <div class="rounded-xl bg-[#161B22] p-6 text-white shadow-lg space-y-6 min-w-0">
            <div class="flex items-center justify-between border-b border-[#30363d] pb-4">
                <button type="button" (click)="goBack()"
                    class="inline-flex items-center gap-2 text-sm font-medium text-gray-400 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                        stroke="currentColor" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                    </svg>
                    Voltar
                </button>

                <div>
                    <button type="button" (click)="togglePreview()"
                        [class]="'inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg border transition-all ' + (showPreview() ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'border-[#30363d] bg-[#0d1117] text-gray-300 hover:text-white')">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                            stroke="currentColor" class="size-4">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9 4.5v15m6-15v15m-10.5-15h15a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 19.5 21h-15A2.25 2.25 0 0 1 3 18.75V6.75A2.25 2.25 0 0 1 5.25 4.5Z" />
                        </svg>
                        {{ showPreview() ? 'Fechar Divisão' : 'Dividir Tela (Preview)' }}
                    </button>
                </div>
            </div>

            <!-- Forms-->
            <form [formGroup]="questionForm" class="space-y-5">
                <!-- Title -->
                <div>
                    <label for="title" class="text-sm font-medium text-gray-300">Título</label>
                    <input id="title" formControlName="title" type="text"
                        placeholder="Ex: Como implementar Refresh Token com Axios e Spring Boot" class="w-full rounded-lg border border-[#30363d] bg-[#0d1117] px-4 py-3 text-white placeholder:text-gray-500 
                        focus:border-emerald-500 focus:outline-none font-inter" />
                </div>

                <!-- Tag Selector Component -->
                <app-tag-selector [technologyNames]="technologyNames"></app-tag-selector>

                <!-- Content -->
                <div>
                    <label for="content" class="text-sm font-medium text-gray-300">Conteúdo</label>
                    <textarea id="content" formControlName="content" rows="14" placeholder="Escreva sua pergunta aqui..."
                        class="w-full rounded-lg border border-[#30363d] bg-[#0d1117] px-4 py-3 text-white placeholder:text-gray-500 focus:border-emerald-500 focus:outline-none font-lora min-h-[300px]">
                    </textarea>
                </div>

                <div class="flex justify-end pt-4">
                    <button type="submit"
                        class="inline-flex items-center gap-2 rounded-lg bg-emerald-600 px-5 py-2.5 text-sm font-medium text-white shadow-sm transition-all hover:bg-emerald-500 hover:shadow-md"
                        (click)="onSubmit()" [disabled]="isSubmiting || questionForm.invalid">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-4">
                            <path fill-rule="evenodd"
                                d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z"
                                clip-rule="evenodd" />
                        </svg>
                        @if (isSubmiting) {
                            @if (isEditMode) {
                                Editando...
                            } @else {
                                Criando...
                            }
                        } @else {
                            @if (isEditMode) {
                                Editar
                            } @else {
                                Criar
                            }
                        }
                    </button>
                </div>
            </form>
        </div>

        <!-- ================= LADO DIREITO: O CARD DE PREVIEW DA TELA ================= -->
        @if (showPreview()) {
            <div class="rounded-xl bg-[#161B22] p-6 text-white shadow-lg flex flex-col sticky top-6 max-h-[calc(100vh-5rem)] min-w-0">
                <!-- Cabeçalho fixo: NUNCA sofre scroll ou corte -->
                <div class="border-b border-[#30363d] pb-4 mb-4 shrink-0">
                    <span class="text-xs font-mono uppercase tracking-wider text-gray-400">
                        Pré-visualização da Pergunta
                    </span>
                    <h2 class="text-2xl font-bold font-inter text-gray-100 mt-2 break-words">
                        {{ questionForm.get('title')?.value || 'Sem título' }}
                    </h2>
                </div>

                <!-- Conteúdo rolável independente com scroll suave e ancoragem estável -->
                <div class="flex-1 overflow-y-auto min-h-0 [overflow-anchor:none] overscroll-contain scrollbar-thin scrollbar-thumb-gray-700 pr-1">
                    <app-preview-mode [content]="questionForm.get('content')?.value || ''"></app-preview-mode>
                </div>
            </div>
        }

    </div>
</section>
