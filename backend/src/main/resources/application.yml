spring:
  application:
    name: backend
  ai:
    mcp:
      server:
        name: central-web
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:sua_senha_aqui}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  profiles:
    active: development
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:seu-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:seu-google-client-secret}
            scope:
              - email
              - profile
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

app:
  oauth2:
    redirect-uri: ${FRONTEND_OAUTH2_REDIRECT_URI:http://localhost:4200/oauth2-redirect}

file:
  upload-dir: uploads/profiles/

logging:
  level:
    root: info
    io.centralweb.backend: debug
    org:
      springframework:
        security: DEBUG

TOKEN_SECRET: ${TOKEN_SECRET:minha-chave-secreta-padrao-desenvolvimento-12345678}

api:
  security:
    refresh:
      expiration: 604800000
